<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="13" font-weight="normal" fill="#1e1e1e"><tspan x="960.0" y="369.3">Three Essential Engineering Rules:</tspan><tspan x="960.0" y="386.4">1. val(c) = c - 'a' + 1 (starts at 1, so 'a' != 'aa' != 'aaa')</tspan><tspan x="960.0" y="403.6">2. Base P = 31 (prime &gt; 26, prevents collisions like 'ka' vs 'ab')</tspan><tspan x="960.0" y="420.7">3. Modulo M = 10^9 + 7 (large prime keeps numbers within long long)</tspan></text>
