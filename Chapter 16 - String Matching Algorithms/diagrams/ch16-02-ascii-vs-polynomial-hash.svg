<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="650.0" y="558.0">Positional powers P^i ensure character ordering directly alters the resulting polynomial hash.</tspan></text>
