<path d="M141.4 149.7 Q382.3 152.0 620.1 151.2 M621.1 149.4 Q621.1 187.2 620.7 228.9 M621.3 231.2 Q381.6 227.4 141.1 230.5 M140.4 229.2 Q138.7 192.8 139.5 150.2" fill="none" stroke="#1971c2" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#1e1e1e"><tspan x="380.0" y="180.8">hs[r] = sum of val(T[k]) * P^k for k in 0..r</tspan><tspan x="380.0" y="199.2">(Cumulative weighted hash up to window end r)</tspan></text>
<rect x="740.0" y="150.0" width="480.0" height="80.0" rx="10" fill="#e9ecef"/>
<path d="M739.8 149.1 Q978.5 152.1 1219.1 149.9 M1219.3 150.3 Q1218.7 187.8 1220.3 231.5 M1220.2 229.0 Q981.7 231.3 739.2 230.9 M738.9 231.3 Q741.1 190.2 741.0 150.9" fill="none" stroke="#343a40" stroke-width="2" stroke-linecap="round"/>
<path d="M740.5 150.9 Q980.7 148.5 1218.6 150.5 M1220.2 149.3 Q1219.7 191.7 1221.6 228.7 M1219.4 228.9 Q977.2 228.3 739.6 229.9 M741.1 230.8 Q741.5 189.9 738.5 148.7" fill="none" stroke="#343a40" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#1e1e1e"><tspan x="980.0" y="180.8">hs[l-1] = sum of val(T[k]) * P^k for k in 0..l-1</tspan><tspan x="980.0" y="199.2">(Cumulative weighted hash before window start l)</tspan></text>
<rect x="330.0" y="260.0" width="700.0" height="110.0" rx="10" fill="#e0d5fa"/>
<path d="M330.9 261.0 Q678.0 262.3 1030.7 258.5 M1030.9 260.6 Q1030.8 316.0 1030.1 369.5 M1030.4 371.2 Q678.1 368.2 331.2 370.4 M331.4 369.7 Q332.3 317.0 330.1 261.2" fill="none" stroke="#6741d9" stroke-width="2" stroke-linecap="round"/>
<path d="M329.9 258.5 Q682.0 261.5 1029.1 260.2 M1028.7 260.8 Q1027.7 312.5 1029.9 369.1 M1030.3 368.9 Q678.7 367.5 330.8 370.6 M329.8 368.4 Q332.1 314.2 328.9 259.6" fill="none" stroke="#6741d9" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="15" font-weight="bold" fill="#1e1e1e"><tspan x="680.0" y="285.3">Subtract to remove unwanted left prefix:</tspan><tspan x="680.0" y="305.1">window_raw = hs[r] - hs[l-1]   (if l &gt; 0; else hs[r])</tspan><tspan x="680.0" y="324.9">= P^l * (T[l]*P^0 + T[l+1]*P^1 + ... + T[r]*P^(m-1))</tspan><tspan x="680.0" y="344.7">= P^l * (hash of the window)</tspan></text>
<rect x="200.0" y="400.0" width="960.0" height="90.0" rx="10" fill="#99e9f2"/>
<path d="M200.4 398.9 Q682.5 399.4 1159.0 399.8 M1161.2 401.3 Q1162.0 443.9 1161.1 490.6 M1158.9 490.6 Q682.3 492.2 198.4 490.0 M200.5 490.9 Q200.7 443.5 198.6 400.5" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round"/>
<path d="M200.6 399.3 Q679.7 397.2 1158.6 400.6 M1159.6 401.2 Q1157.7 447.4 1159.6 489.2 M1160.6 491.3 Q681.8 491.4 198.9 489.4 M199.7 489.2 Q202.7 442.9 198.6 400.2" fill="none" stroke="#0c8599" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="15" font-weight="bold" fill="#1e1e1e"><tspan x="680.0" y="415.3">Crucial Design Decision: Multiply, Never Divide!</tspan><tspan x="680.0" y="435.1">• Dividing window_raw by P^l causes precision loss and requires modular inverse.</tspan><tspan x="680.0" y="454.9">• Instead: multiply pattern hash by P^l (pw[l]):</tspan><tspan x="680.0" y="474.7">  winHash == (patHash * pw[l]) % MOD</tspan></text>
<rect x="330.0" y="515.0" width="700.0" height="65.0" rx="10" fill="#ffec99"/>
<path d="M330.0 516.3 Q680.8 516.6 1031.2 516.1 M1030.5 515.4 Q1030.4 546.2 1029.2 579.5 M1028.7 579.8 Q678.9 578.0 331.0 579.7 M329.9 578.5 Q332.0 549.0 329.1 515.2" fill="none" stroke="#f08c00" stroke-width="2" stroke-linecap="round"/>
<path d="M329.4 516.0 Q679.4 513.5 1030.8 514.6 M1030.2 516.5 Q1032.6 547.0 1028.8 580.0 M1028.8 581.3 Q678.9 580.5 330.5 579.9 M331.1 581.1 Q332.7 546.7 329.3 515.3" fill="none" stroke="#f08c00" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="bold" fill="#1e1e1e"><tspan x="680.0" y="529.0">C++ Modular Subtraction Safety Rule:</tspan><tspan x="680.0" y="547.5">winHash = (hs[r] - hs[l-1] + MOD) % MOD</tspan><tspan x="680.0" y="566.0">(+ MOD prevents negative values resulting from % operator in C++)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="680.0" y="598.0">Subtracting prefix hashes leaves the window weighted by P^l, matching patHash * P^l without division.</tspan></text>
</svg>