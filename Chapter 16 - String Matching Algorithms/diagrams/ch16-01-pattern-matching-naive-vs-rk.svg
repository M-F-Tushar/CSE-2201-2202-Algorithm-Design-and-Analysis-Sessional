<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="630.0" y="548.0">Rabin-Karp replaces m character comparisons per window with a single O(1) integer hash check.</tspan></text>
