<line x1="232" y1="111" x2="372" y2="111" stroke="#2f9e44" stroke-width="2"/>
<text x="302" y="127" text-anchor="middle" font-weight="bold" font-size="15" fill="#1e1e1e">6</text>
<line x1="203.7" y1="140" x2="209.3" y2="372" stroke="#2f9e44" stroke-width="2"/>
<text x="190.5" y="256.4" text-anchor="middle" font-weight="bold" font-size="15" fill="#1e1e1e">5</text>
