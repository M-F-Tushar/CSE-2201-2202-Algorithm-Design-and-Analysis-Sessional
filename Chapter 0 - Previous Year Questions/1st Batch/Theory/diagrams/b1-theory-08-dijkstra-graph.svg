<circle cx="401" cy="111" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="401" y="111" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e1e1e">E</text>
<circle cx="544" cy="261" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="544" y="261" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e1e1e">C</text>
<circle cx="210" cy="401" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="210" y="401" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e1e1e">D</text>
<circle cx="410" cy="401" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="410" y="401" text-anchor="middle" font-weight="bold" font-size="18" fill="#1e1e1e">F</text>
<text x="80" y="312" text-anchor="middle" font-size="15" fill="#1e1e1e">d = 0</text>
<text x="203" y="66" text-anchor="middle" font-size="15" fill="#1e1e1e">d = 2</text>
<text x="401" y="66" text-anchor="middle" font-size="15" fill="#1e1e1e">d = 8</text>
