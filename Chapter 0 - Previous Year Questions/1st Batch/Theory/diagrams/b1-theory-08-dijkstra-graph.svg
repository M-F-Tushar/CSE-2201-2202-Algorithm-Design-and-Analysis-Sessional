<text x="292.1" y="247.2" text-anchor="middle" font-weight="bold" font-size="15" fill="#868e96">3</text>
<line x1="401.9" y1="140" x2="409.1" y2="372" stroke="#868e96" stroke-width="2" stroke-dasharray="7 6"/>
<text x="389.5" y="256.5" text-anchor="middle" font-weight="bold" font-size="15" fill="#868e96">1</text>
<line x1="421" y1="132" x2="524" y2="240" stroke="#868e96" stroke-width="2" stroke-dasharray="7 6"/>
<text x="460.9" y="197" text-anchor="middle" font-weight="bold" font-size="15" fill="#868e96">9</text>
<line x1="430.1" y1="380" x2="523.9" y2="282" stroke="#2f9e44" stroke-width="2"/>
<text x="488.6" y="342.1" text-anchor="middle" font-weight="bold" font-size="15" fill="#1e1e1e">3</text>
