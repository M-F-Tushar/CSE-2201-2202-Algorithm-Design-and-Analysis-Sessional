</g>

<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" fill="#495057"><tspan x="400" y="382">Every parent is at least as large as its children. The root 7 is the largest value.</tspan></text>

<g font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#1e1e1e">
