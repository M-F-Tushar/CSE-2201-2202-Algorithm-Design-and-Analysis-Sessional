<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Max-heap after build step for A = [7, 2, 5, 3, 4, 6, 1]">
<rect width="800" height="500" fill="#ffffff" rx="10"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="21" font-weight="bold" fill="#1e1e1e"><tspan x="400" y="34">Heap Sort: Max-Heap After Build Step</tspan></text>

<g stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" fill="none">
<path d="M400 110 L250 220 M400 110 L550 220"/>
<path d="M250 220 L175 330 M250 220 L325 330"/>
<path d="M550 220 L475 330 M550 220 L625 330"/>
</g>

<g font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="bold" fill="#1e1e1e">
<circle cx="400" cy="110" r="26" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
<text x="400" y="110">7</text>
<circle cx="250" cy="220" r="26" fill="#99e9f2" stroke="#0c8599" stroke-width="2"/>
<text x="250" y="220">4</text>
<circle cx="550" cy="220" r="26" fill="#99e9f2" stroke="#0c8599" stroke-width="2"/>
<text x="550" y="220">6</text>
<circle cx="175" cy="330" r="26" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="175" y="330">3</text>
<circle cx="325" cy="330" r="26" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="325" y="330">2</text>
<circle cx="475" cy="330" r="26" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="475" y="330">5</text>
<circle cx="625" cy="330" r="26" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
