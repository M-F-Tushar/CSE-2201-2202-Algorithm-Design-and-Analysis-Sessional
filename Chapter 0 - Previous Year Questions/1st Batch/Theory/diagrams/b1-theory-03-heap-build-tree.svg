<rect x="290" y="420" width="60" height="40" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.8"/><text x="320" y="440">3</text>
<rect x="370" y="420" width="60" height="40" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.8"/><text x="400" y="440">2</text>
<rect x="450" y="420" width="60" height="40" rx="6" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.8"/><text x="480" y="440">5</text>
