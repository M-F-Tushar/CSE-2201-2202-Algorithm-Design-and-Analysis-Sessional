<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="15" font-weight="bold" fill="#1e1e1e"><tspan x="450" y="462">Each level costs n, and there are log2(n) + 1 levels: T(n) = Θ(n log n)</tspan></text>
