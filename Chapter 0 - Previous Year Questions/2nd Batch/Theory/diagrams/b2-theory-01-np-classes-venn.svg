<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img" aria-label="Q2(a): How P, NP, NP-complete and NP-hard relate">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e" /></marker></defs>
<rect width="800" height="550" fill="#ffffff" rx="10" />
<g font-family="&quot;Segoe Print&quot;, &quot;Bradley Hand&quot;, Chilanka, &quot;Comic Sans MS&quot;, &quot;Comic Neue&quot;, cursive" dominant-baseline="central">
<text x="400" y="28.0" text-anchor="middle" font-size="20" fill="#1e1e1e" font-weight="bold">Q2(a): How P, NP, NP-complete and NP-hard Relate</text>
<circle cx="300" cy="260" r="170" fill="transparent" stroke="#1971c2" stroke-width="2" />
<circle cx="480" cy="260" r="170" fill="transparent" stroke="#e8590c" stroke-width="2" />
<circle cx="230" cy="260" r="60" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" />
<text x="230" y="260.0" text-anchor="middle" font-size="20" fill="#1e1e1e">P</text>
<text x="210" y="128.0" text-anchor="middle" font-size="20" fill="#1971c2" font-weight="bold">NP</text>
<text x="390" y="260.0" text-anchor="middle" font-size="16" fill="#1e1e1e" font-weight="bold">NP-complete</text>
<text x="565" y="235.6" text-anchor="middle" font-size="15" fill="#e8590c">NP-hard</text>
<text x="565" y="254.4" text-anchor="middle" font-size="15" fill="#e8590c">(not in NP)</text>
<text x="400" y="460" text-anchor="middle" font-size="14" fill="#1e1e1e">P ⊆ NP; NP-complete = NP ∩ NP-hard.</text>
<text x="400" y="490" text-anchor="middle" font-size="14" fill="#1e1e1e">NP-hard need not be in NP; TSP optimization is NP-hard.</text>
<text x="400" y="520" text-anchor="middle" font-size="14" fill="#868e96">Shown under P ≠ NP (unproved): P and NP-complete are then disjoint.</text>
</g>
</svg>