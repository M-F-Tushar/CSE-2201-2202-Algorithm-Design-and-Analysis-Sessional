<text x="467" y="312.5" text-anchor="middle" font-size="12" fill="#1e1e1e">w = 4, p = 40, ub = 70</text>
<rect x="1" y="389" width="148" height="52" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
