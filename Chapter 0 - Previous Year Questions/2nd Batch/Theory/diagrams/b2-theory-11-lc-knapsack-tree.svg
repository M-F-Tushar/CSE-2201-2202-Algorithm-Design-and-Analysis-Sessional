<text x="545" y="422.5" text-anchor="middle" font-size="12" fill="#1e1e1e">ub = 60  ✗ pruned</text>
<polyline points="475.0,138.0 310.0,179.0" fill="none" stroke="#2f9e44" stroke-width="3" marker-end="url(#arrow)"/>
