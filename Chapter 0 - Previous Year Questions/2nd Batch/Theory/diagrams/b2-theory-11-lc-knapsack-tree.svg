<text x="400" y="480.0" text-anchor="middle" font-size="13" fill="#1e1e1e">Expansion order: Start → A = 1 → C = 1 → C = 0 → B = 1 gives profit 70 (best so far).</text>
<text x="400" y="504.0" text-anchor="middle" font-size="13" fill="#868e96">After that, every node with ub ≤ 70 is pruned, because it cannot beat 70.</text>
<text x="400" y="530.0" text-anchor="middle" font-size="16" fill="#2f9e44" font-weight="bold">Answer: take A and B. Profit 70, weight 10.</text>
