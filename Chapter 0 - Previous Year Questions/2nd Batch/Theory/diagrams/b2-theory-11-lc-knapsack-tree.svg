<text x="310" y="197.5" text-anchor="middle" font-size="12" fill="#1e1e1e">A = 1 (take A)</text>
<text x="310" y="212.5" text-anchor="middle" font-size="12" fill="#1e1e1e">w = 4, p = 40, ub = 73</text>
<rect x="555" y="179" width="170" height="52" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="640" y="197.5" text-anchor="middle" font-size="12" fill="#1e1e1e">A = 0</text>
<text x="640" y="212.5" text-anchor="middle" font-size="12" fill="#1e1e1e">ub = 52  ✗ pruned</text>
<rect x="67" y="279" width="170" height="52" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="152" y="297.5" text-anchor="middle" font-size="12" fill="#1e1e1e">C = 1 (take C)</text>
<text x="152" y="312.5" text-anchor="middle" font-size="12" fill="#1e1e1e">w = 7, p = 58, ub = 73</text>
