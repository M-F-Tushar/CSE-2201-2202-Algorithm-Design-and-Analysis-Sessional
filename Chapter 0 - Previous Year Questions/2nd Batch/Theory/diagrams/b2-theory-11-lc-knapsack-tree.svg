<text x="390" y="422.5" text-anchor="middle" font-size="12" fill="#1e1e1e">p = 70, w = 10  ✓</text>
<rect x="471" y="389" width="148" height="52" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
