<text x="400" y="48.0" text-anchor="middle" font-size="13" fill="#1e1e1e">Items (weight, profit): A (4, 40), C (3, 18), B (6, 30), D (5, 20).</text>
<text x="400" y="68.0" text-anchor="middle" font-size="13" fill="#868e96">Sorted by profit/weight: A (10), C (6), B (5), D (4). ub = upper bound (fractional fill).</text>
<rect x="375" y="86" width="200" height="52" rx="8" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="475" y="104.5" text-anchor="middle" font-size="12" fill="#1e1e1e">Start (nothing decided)</text>
<text x="475" y="119.5" text-anchor="middle" font-size="12" fill="#1e1e1e">ub = 73</text>
