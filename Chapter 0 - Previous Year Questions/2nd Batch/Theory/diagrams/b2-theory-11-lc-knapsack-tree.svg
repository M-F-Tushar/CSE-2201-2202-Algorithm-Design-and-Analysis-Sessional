<text x="230" y="422.5" text-anchor="middle" font-size="12" fill="#1e1e1e">ub = 70  ✗ pruned</text>
<rect x="316" y="389" width="148" height="52" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
