<text x="40" y="395.0" text-anchor="start" font-size="14" fill="#1e1e1e">Sorted edges: (1,5)=1, (1,4)=1, (2,1)=2, (3,2)=3, (3,1)=3,</text>
<text x="40" y="419.0" text-anchor="start" font-size="14" fill="#1e1e1e">(3,4)=5, (4,5)=6, (0,2)=7, (0,3)=9</text>
<text x="40" y="443.0" text-anchor="start" font-size="14" fill="#1e1e1e">1. Take (1,5), (1,4), (2,1), (3,2). None makes a cycle.</text>
<text x="40" y="467.0" text-anchor="start" font-size="14" fill="#1e1e1e">2. Skip (3,1), (3,4), (4,5). Each one closes a cycle.</text>
<text x="40" y="491.0" text-anchor="start" font-size="14" fill="#1e1e1e">3. Take (0,2). All 6 vertices are now connected with 5 edges.</text>
<text x="40" y="515.0" text-anchor="start" font-size="16" fill="#2f9e44" font-weight="bold">MST cost = 1 + 1 + 2 + 3 + 7 = 14</text>
<text x="40" y="540.0" text-anchor="start" font-size="13" fill="#868e96">Weights were read from a low-resolution scan. Confirm them against the paper.</text>
