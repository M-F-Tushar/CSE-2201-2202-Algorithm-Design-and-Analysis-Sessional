<rect x="180" y="485" width="440" height="40" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="400" y="505.0" text-anchor="middle" font-size="16" fill="#1e1e1e">Final: [1005, 1010, 1023, 1040, 1055]</text>
