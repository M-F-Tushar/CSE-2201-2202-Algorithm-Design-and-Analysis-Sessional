<svg xmlns="http://www.w3.org/2000/svg" width="800" height="545" viewBox="0 0 800 545" role="img" aria-label="Q4(b): quick sort partition tree">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect width="800" height="545" fill="#ffffff" rx="10"/>
<g font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' dominant-baseline="central">
<text x="400" y="28.0" text-anchor="middle" font-size="19" fill="#1e1e1e" font-weight="bold">Q4(b): Quick Sort Partition Tree (last element as pivot)</text>
