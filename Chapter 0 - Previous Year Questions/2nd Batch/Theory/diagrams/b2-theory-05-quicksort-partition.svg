<text x="215" y="229.8" text-anchor="middle" font-size="14" fill="#1e1e1e">Pivot = 1005 → [1005, 1010, 1023]</text>
<rect x="470" y="190" width="200" height="62" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
