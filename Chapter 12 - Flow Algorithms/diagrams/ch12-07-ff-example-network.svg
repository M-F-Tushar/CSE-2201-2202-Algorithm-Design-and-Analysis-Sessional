<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="15" font-weight="normal" fill="#1e1e1e"><tspan x="945.0" y="186.0">The problem</tspan><tspan x="945.0" y="205.8">Find the maximum flow from s to t.</tspan><tspan x="945.0" y="225.6"></tspan><tspan x="945.0" y="245.4">7 vertices, 12 directed edges.</tspan><tspan x="945.0" y="265.2">Every label is flow/capacity.</tspan><tspan x="945.0" y="285.0">No flow yet: every edge is 0/c</tspan><tspan x="945.0" y="304.8">and the flow value |f| = 0.</tspan><tspan x="945.0" y="324.6"></tspan><tspan x="945.0" y="344.4">Out of s: 5 + 10 + 12 = 27</tspan><tspan x="945.0" y="364.2">Into t: 10 + 3 + 9 = 22</tspan><tspan x="945.0" y="384.0">So the answer can never exceed 22.</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="575.0" y="538.0">Source s (green) pushes, sink t (red) receives; a, b, c, d, e must pass on all they get</tspan></text>
</svg>