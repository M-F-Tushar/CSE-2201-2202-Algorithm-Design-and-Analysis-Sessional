<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="555.0" y="418.0">Unlike quicksort, selection recurses into one side only, which turns n log n into n</tspan></text>
