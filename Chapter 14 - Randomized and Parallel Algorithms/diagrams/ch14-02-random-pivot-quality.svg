<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#1e1e1e"><tspan x="540.0" y="270.8">A good pivot appears in 2 tries on average, so the sizes shrink geometrically:</tspan><tspan x="540.0" y="289.2">recursion depth is O(log n) and expected comparisons are about 2 n ln n</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="540.0" y="358.0">Random pivot choice means no fixed input (sorted, reversed, ...) can force the worst case</tspan></text>
</svg>