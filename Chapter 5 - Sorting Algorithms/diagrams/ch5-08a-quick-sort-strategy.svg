<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="11" font-weight="bold" fill="#1e1e1e"><tspan x="540.0" y="238.0">Base Case: Any subarray with 0 or 1 item is already sorted -&gt; Return immediately!</tspan></text>
<rect x="28.0" y="276.0" width="1024.0" height="40.0" rx="10" fill="#f8f9fa"/>
<path d="M28.0 277.3 Q540.8 277.6 1053.2 277.1 M1052.5 276.4 Q1052.4 294.7 1051.2 315.5 M1050.7 315.8 Q538.9 314.0 29.0 315.7 M27.9 314.5 Q30.0 297.5 27.1 276.2" fill="none" stroke="#868e96" stroke-width="2" stroke-linecap="round"/>
<path d="M27.4 277.0 Q539.4 274.5 1052.8 275.6 M1052.2 277.5 Q1054.6 295.5 1050.8 316.0 M1050.8 317.3 Q538.9 316.5 28.5 315.9 M29.1 317.1 Q30.7 295.2 27.3 276.3" fill="none" stroke="#868e96" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="11" font-weight="normal" fill="#1e1e1e"><tspan x="540.0" y="296.0">Key Insight: No extra merging array needed. The pivot locks permanently into place in-place.</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="14" font-weight="normal" fill="#868e96"><tspan x="540.0" y="318.0">Quick Sort divide-and-conquer strategy: Pick Pivot, Partition array in-place, and Recurse on both sides.</tspan></text>
</svg>