<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="12" font-weight="bold" fill="#1e1e1e"><tspan x="183.0" y="111.2">Step 1: Pick a Pivot</tspan><tspan x="183.0" y="127.1">Select a benchmark item.</tspan><tspan x="183.0" y="142.9">Usually last item A[high].</tspan><tspan x="183.0" y="158.8">Everything compares to it!</tspan></text>
<rect x="384.0" y="80.0" width="310.0" height="110.0" rx="10" fill="#99e9f2"/>
<path d="M383.8 79.1 Q537.5 82.1 693.1 79.9 M693.3 80.3 Q692.7 132.8 694.3 191.5 M694.2 189.0 Q540.7 191.3 383.2 190.9 M382.9 191.3 Q385.1 135.2 385.0 80.9" fill="none" stroke="#0c8599" stroke-width="2" stroke-linecap="round"/>
<path d="M384.5 80.9 Q539.7 78.5 692.6 80.5 M694.2 79.3 Q693.7 136.7 695.6 188.7 M693.4 188.9 Q536.2 188.3 383.6 189.9 M385.1 190.8 Q385.5 134.9 382.5 78.7" fill="none" stroke="#0c8599" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="12" font-weight="bold" fill="#1e1e1e"><tspan x="539.0" y="103.3">Step 2: Partition Array</tspan><tspan x="539.0" y="119.2">Two markers (i bound, j scan).</tspan><tspan x="539.0" y="135.0">Swap items &lt;= pivot to left!</tspan><tspan x="539.0" y="150.8">Finally, swap pivot into i.</tspan><tspan x="539.0" y="166.7">Pivot locks in final spot!</tspan></text>
<rect x="742.0" y="80.0" width="310.0" height="110.0" rx="10" fill="#a5d8ff"/>
<path d="M742.9 81.0 Q895.0 82.3 1052.7 78.5 M1052.9 80.6 Q1052.8 136.0 1052.1 189.5 M1052.4 191.2 Q895.1 188.2 743.2 190.4 M743.4 189.7 Q744.3 137.0 742.1 81.2" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round"/>
<path d="M741.9 78.5 Q899.0 81.5 1051.1 80.2 M1050.7 80.8 Q1049.7 132.5 1051.9 189.1 M1052.3 188.9 Q895.7 187.5 742.8 190.6 M741.8 188.4 Q744.1 134.2 740.9 79.6" fill="none" stroke="#1971c2" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="12" font-weight="bold" fill="#1e1e1e"><tspan x="897.0" y="103.3">Step 3: Recursively Repeat</tspan><tspan x="897.0" y="119.2">Divide and conquer!</tspan><tspan x="897.0" y="135.0">Sort left subarray (&lt;= pivot)</tspan><tspan x="897.0" y="150.8">and right subarray (&gt; pivot).</tspan><tspan x="897.0" y="166.7">Stop when subarray size &lt;= 1.</tspan></text>
