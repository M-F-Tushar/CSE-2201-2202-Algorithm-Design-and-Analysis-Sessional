<text text-anchor="middle" dominant-baseline="central" font-family='"Segoe Print", "Bradley Hand", Chilanka, "Comic Sans MS", "Comic Neue", cursive' font-size="13" font-weight="bold" fill="#1e1e1e"><tspan x="540.0" y="39.0">Quick Sort Strategy Escalator: The 3 Core Steps (Michael Sambol Method)</tspan></text>
<rect x="28.0" y="80.0" width="310.0" height="110.0" rx="10" fill="#ffec99"/>
<path d="M28.1 79.7 Q180.4 79.8 338.8 81.1 M338.1 79.5 Q337.9 132.9 336.6 188.5 M337.9 190.5 Q181.4 188.5 26.4 189.8 M27.2 191.2 Q28.5 135.6 27.2 79.3" fill="none" stroke="#f08c00" stroke-width="2" stroke-linecap="round"/>
