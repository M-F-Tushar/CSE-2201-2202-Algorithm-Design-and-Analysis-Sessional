<path d="M28.4 216.9 Q542.5 217.4 1051.0 217.8 M1053.2 219.3 Q1054.0 236.9 1053.1 258.6 M1050.9 258.6 Q542.3 260.2 26.4 258.0 M28.5 258.9 Q28.7 236.5 26.6 218.5" fill="none" stroke="#2f9e44" stroke-width="2" stroke-linecap="round"/>
